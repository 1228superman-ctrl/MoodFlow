name: MoodFlow
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "3"
    MARKETING_VERSION: "0.3.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MoodFlow:
    type: application
    platform: iOS
    sources: [Native, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.moodflow.validation
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Config/iOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/Health.entitlements
  MoodFlowWatch:
    type: application
    platform: watchOS
    sources: [Native, Shared]
    dependencies:
      - target: MoodFlowWatchFace
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.moodflow.validation.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: Config/Watch.plist
        CODE_SIGN_ENTITLEMENTS: Config/WatchHealth.entitlements
  MoodFlowWatchFace:
    type: app-extension
    platform: watchOS
    sources: [WatchFace, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.moodflow.validation.watchkitapp.moodface
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: Config/WatchFace.plist
        CODE_SIGN_ENTITLEMENTS: Config/MoodFace.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  MoodFlow:
    build:
      targets:
        MoodFlow: all
  MoodFlowWatch:
    build:
      targets:
        MoodFlowWatch: all
